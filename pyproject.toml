[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrawler-research-studio"
version = "0.1.0"
description = "Phase 1 foundation for PyCrawler Research Studio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5.2,<6.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pdfplumber>=0.11.7,<1.0.0",
  "Pillow>=11.2.1,<12.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "PyMuPDF>=1.26.0,<2.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "pytesseract>=0.3.13,<1.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "redis>=5.2.0,<6.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["backend/tests", "worker/tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "worker*"]
